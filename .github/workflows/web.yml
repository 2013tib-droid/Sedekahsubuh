name: Deploy web

# Web statis di web/ + RANCANGAN-KONTEN.md, diterbitkan ke GitHub Pages
# setiap kali salah satunya berubah.
on:
  push:
    paths:
      - web/**
      - RANCANGAN-KONTEN.md
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Susun _site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp RANCANGAN-KONTEN.md _site/
          touch _site/.nojekyll

      - name: Aktifkan & konfigurasi GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploy hanya dari branch default: environment github-pages menolak branch
  # lain. Run dari branch fitur tetap membangun _site, hanya publikasinya dilewati.
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy ke GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
