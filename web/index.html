<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sedekah Subuh — Rancangan Konten</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤲</text></svg>">
<meta name="theme-color" content="#3F5A3C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  /* Palet mengikuti identitas visual di RANCANGAN-KONTEN.md bagian 3. */
  :root {
    color-scheme: light;
    --olive: #3F5A3C;
    --olive-strong: #2f4630;
    --cream: #F3EBDD;
    --gold: #D9A441;
    --wood: #7A5A3A;
    --bg: #faf6ee;
    --surface: #ffffff;
    --surface-soft: #f3ebdd;
    --border: #e6dccb;
    --text: #22201b;
    --text-2: #5b5448;
    --muted: #8c8374;
    --accent: var(--olive);
    --accent-soft: #e6ede3;
    --gold-soft: #f8ecd2;
    --code-bg: #f6f1e7;
    --shadow: 0 1px 2px rgba(40,30,10,.05), 0 8px 24px -14px rgba(40,30,10,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #161a15;
      --surface: #1f241e;
      --surface-soft: #262c24;
      --border: #343b31;
      --text: #ece6da;
      --text-2: #c2bba9;
      --muted: #8f8a7c;
      --accent: #9dbb8f;
      --accent-soft: #2a3527;
      --gold-soft: #3a3120;
      --code-bg: #1a1e19;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3, .serif { font-family: "Playfair Display", Georgia, serif; }
  a { color: var(--accent); }

  header.top {
    background: var(--olive); color: var(--cream);
    padding: 20px 16px 0;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header.top h1 { margin: 0; font-size: 1.6rem; line-height: 1.2; }
  header.top p { margin: 4px 0 14px; opacity: .85; font-size: .92rem; }
  nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    flex: 0 0 auto; border: 0; cursor: pointer; font: inherit; font-weight: 500;
    padding: 10px 16px; border-radius: 10px 10px 0 0;
    background: transparent; color: var(--cream); opacity: .8;
  }
  nav.tabs button[aria-selected="true"] { background: var(--bg); color: var(--text); opacity: 1; }

  main { padding: 20px 16px 60px; }
  section[hidden] { display: none; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .card > .eyebrow:first-child { margin-top: 0; }
  .eyebrow { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .today-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  .today-head h2 { margin: 2px 0 0; font-size: 1.5rem; }
  .pill {
    display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600;
    background: var(--accent-soft); color: var(--accent);
  }
  .pill.gold { background: var(--gold-soft); color: #9a6a12; }
  @media (prefers-color-scheme: dark) { .pill.gold { color: var(--gold); } }
  .muted { color: var(--muted); }
  .small { font-size: .88rem; }

  .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: .9rem; color: var(--text-2); }
  .settings input[type=date] {
    font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
  }

  ol.steps { margin: 8px 0 0; padding-left: 1.3rem; }
  ol.steps li { margin: 4px 0; }

  /* Kartu triptych: 3 panel berdampingan, jadi tumpuk di HP. */
  .trip-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  .trip-title h3 { margin: 0; font-size: 1.2rem; }
  .panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  @media (max-width: 640px) { .panels { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface-soft); border-radius: 10px; padding: 12px; position: relative;
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .panel .lbl { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--wood); }
  @media (prefers-color-scheme: dark) { .panel .lbl { color: var(--gold); } }
  .panel .txt { font-size: .95rem; overflow-wrap: anywhere; }
  .visual { margin-top: 10px; font-size: .9rem; color: var(--text-2); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

  button.btn {
    font: inherit; font-size: .85rem; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 7px 12px; border-radius: 8px; min-height: 36px;
  }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--olive); border-color: var(--olive); color: var(--cream); }
  button.btn.primary:hover { background: var(--olive-strong); }
  button.copy-mini {
    align-self: flex-start; font: inherit; font-size: .75rem; cursor: pointer; margin-top: auto;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    padding: 3px 8px; border-radius: 6px;
  }

  .week-block { margin-bottom: 26px; }
  .week-block > h2 { font-size: 1.25rem; margin: 0 0 4px; }
  .week-block > .muted { margin: 0 0 12px; }
  .filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .filter button {
    font: inherit; font-size: .85rem; cursor: pointer; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  }
  .filter button[aria-pressed="true"] { background: var(--olive); color: var(--cream); border-color: var(--olive); }
  .card.is-today { outline: 2px solid var(--gold); }

  .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
  .week-grid div {
    border-radius: 8px; padding: 8px 4px; text-align: center; font-size: .78rem;
    background: var(--surface-soft); color: var(--text-2);
  }
  .week-grid div b { display: block; font-size: .85rem; color: var(--text); }
  .week-grid div.now { outline: 2px solid var(--gold); }
  .week-grid div.trip { background: var(--accent-soft); }
  @media (max-width: 480px) { .week-grid div { font-size: .68rem; padding: 6px 2px; } }

  /* Panduan lengkap (hasil render markdown) */
  .doc-layout { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 820px) { .doc-layout { grid-template-columns: 1fr; } }
  .toc { position: sticky; top: 12px; font-size: .88rem; }
  @media (max-width: 820px) { .toc { position: static; } }
  .toc a { display: block; padding: 4px 8px; border-radius: 6px; text-decoration: none; color: var(--text-2); }
  .toc a:hover { background: var(--surface-soft); color: var(--text); }
  .toc details summary { cursor: pointer; font-weight: 600; padding: 4px 8px; }
  .doc { min-width: 0; }
  .doc h1 { font-size: 1.6rem; line-height: 1.25; margin-top: 0; }
  .doc h2 { font-size: 1.35rem; margin-top: 2rem; padding-top: .5rem; border-top: 1px solid var(--border); }
  .doc h3 { font-size: 1.1rem; margin-top: 1.5rem; }
  .doc hr { display: none; }
  .doc blockquote {
    margin: 1rem 0; padding: 10px 14px; border-left: 4px solid var(--gold);
    background: var(--gold-soft); border-radius: 0 8px 8px 0; color: var(--text-2);
  }
  .doc blockquote p { margin: .3rem 0; }
  .doc code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
  .doc pre {
    position: relative; background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; overflow-x: auto; font-size: .82rem; line-height: 1.5;
  }
  .doc pre code { background: none; padding: 0; }
  .doc pre button.copy-mini { position: absolute; top: 8px; right: 8px; margin: 0; }
  .table-scroll { overflow-x: auto; margin: 1rem 0; }
  .doc table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  .doc th, .doc td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  .doc th { background: var(--surface-soft); }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px);
    background: var(--olive); color: var(--cream); padding: 10px 16px; border-radius: 10px;
    font-size: .9rem; opacity: 0; pointer-events: none; transition: .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .err { color: #a3261d; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Sedekah Subuh · @wadahqris.id</h1>
    <p>Rancangan konten Instagram: triptych Senin–Rabu–Jumat, Reels, dan Story</p>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="hari-ini" aria-selected="true">Hari Ini</button>
      <button role="tab" data-tab="kalender" aria-selected="false">Kalender</button>
      <button role="tab" data-tab="panduan" aria-selected="false">Panduan</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="hari-ini" role="tabpanel">
    <p class="muted">Memuat…</p>
  </section>
  <section id="kalender" role="tabpanel" hidden></section>
  <section id="panduan" role="tabpanel" hidden>
    <div class="doc-layout">
      <aside class="toc" id="toc"></aside>
      <article class="doc" id="doc"></article>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
(() => {
  // Semua isi diambil dari RANCANGAN-KONTEN.md, jadi cukup edit file itu —
  // web ini ikut berubah setelah deploy berikutnya.
  const SRC = "RANCANGAN-KONTEN.md";
  const TOTAL = 30;
  const TRIP_DAYS = ["Senin", "Rabu", "Jumat"];
  const START_KEY = "sedekahsubuh.mulai";

  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const plain = s => s.replace(/\*\*(.+?)\*\*/g, "$1").replace(/\*(.+?)\*/g, "$1").replace(/`(.+?)`/g, "$1").trim();
  const inline = s => marked.parseInline(s);

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
  };

  // ---------- Tab ----------
  const tabs = [...document.querySelectorAll("nav.tabs button")];
  function showTab(id, push = true) {
    if (!document.getElementById(id)) id = "hari-ini";
    tabs.forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
    document.querySelectorAll("main > section").forEach(s => s.hidden = s.id !== id);
    if (push) history.replaceState(null, "", "#" + id);
    window.scrollTo(0, 0);
  }
  tabs.forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

  // ---------- Salin ----------
  const toast = $("#toast");
  let toastTimer;
  function notify(msg) {
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 1600);
  }
  async function copy(text, what = "Teks") {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = Object.assign(document.createElement("textarea"), { value: text });
      document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    notify(what + " disalin ✓");
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-copy]");
    if (b) copy(b.dataset.copy, b.dataset.what || "Teks");
  });

  // ---------- Parsing markdown ----------
  function parseCalendar(md) {
    const weeks = [];
    let week = null, item = null;
    for (const line of md.split("\n")) {
      let m;
      if ((m = line.match(/^### Pekan (\d+) — "(.+?)"(?: \((.+?)\))?/))) {
        week = { no: +m[1], title: m[2], mood: m[3] || "", items: [] };
        weeks.push(week); item = null;
      } else if (week && (m = line.match(/^\*\*#(\d+) · (\S+) — (.+?)\*\*/))) {
        item = { no: +m[1], day: m[2], title: m[3], week: week.no, weekTitle: week.title, mood: week.mood, P1: "", P2: "", P3: "", Visual: "" };
        week.items.push(item);
      } else if (item && (m = line.match(/^- (P1|P2|P3|Visual): (.+)/))) {
        item[m[1]] = m[2].trim();
      } else if (/^## /.test(line)) {
        week = null; item = null;
      }
    }
    return weeks;
  }
  function extractCode(md, heading) {
    const i = md.indexOf(heading);
    if (i < 0) return "";
    const m = md.slice(i).match(/```[^\n]*\n([\s\S]*?)```/);
    return m ? m[1].trim() : "";
  }
  function moodLight(prompts, weekNo) {
    // Bagian 6c: kalimat pencahayaan per rentang pekan.
    const m = prompts.moods.find(x => weekNo >= x.from && weekNo <= x.to);
    return m ? m.text : "";
  }
  function parseMoods(md) {
    const out = [];
    const re = /^- Pekan (\d+)–(\d+): `(.+?)`/gm;
    let m;
    while ((m = re.exec(md))) out.push({ from: +m[1], to: +m[2], text: m[3] });
    return out;
  }

  // ---------- Prompt terisi ----------
  function imagePrompt(it, P) {
    let p = P.master.replace("[DESKRIPSI VISUAL]", plain(it.Visual).replace(/\.$/, ""));
    // Objek utama sudah tercakup di deskripsi visual.
    p = p.replace(/ \[OBJEK UTAMA\]/, "");
    const light = moodLight(P, it.week);
    if (light) p = p.replace(/soft golden-hour sunrise\s+light/, light);
    return p;
  }
  const dalil = it => plain(it.P2);
  const captionPrompt = (it, P) => P.caption.replace("[TEMA]", it.title).replace("[DALIL + SUMBER]", dalil(it));
  const reelsPrompt = (it, P) => P.reels.replace("[TEMA]", it.title).replace("[DALIL + SUMBER]", dalil(it));

  // ---------- Kartu triptych ----------
  function tripCard(it, P, { today = false, note = "" } = {}) {
    const panel = (key, label) => `
      <div class="panel">
        <span class="lbl">${label}</span>
        <div class="txt">${inline(it[key])}</div>
        <button class="copy-mini" data-copy="${esc(plain(it[key]))}" data-what="${label}">Salin</button>
      </div>`;
    return `
      <div class="card${today ? " is-today" : ""}" id="t${String(it.no).padStart(2, "0")}">
        <div class="trip-title">
          <span class="pill">#${String(it.no).padStart(2, "0")} · ${esc(it.day)}</span>
          <h3>${esc(it.title)}</h3>
        </div>
        ${note ? `<p class="small muted" style="margin:0 0 10px">${note}</p>` : ""}
        <div class="panels">
          ${panel("P1", "Panel 1 · Hook")}
          ${panel("P2", "Panel 2 · Dalil")}
          ${panel("P3", "Panel 3 · Aksi")}
        </div>
        <div class="visual">🎨 <b>Visual:</b> ${inline(it.Visual)}</div>
        <div class="actions">
          <button class="btn primary" data-copy="${esc(imagePrompt(it, P))}" data-what="Prompt gambar">Salin prompt gambar</button>
          <button class="btn" data-copy="${esc(captionPrompt(it, P))}" data-what="Prompt caption">Salin prompt caption</button>
          <button class="btn" data-copy="${esc(reelsPrompt(it, P))}" data-what="Prompt caption Reels">Salin prompt Reels</button>
        </div>
      </div>`;
  }

  // ---------- Hitung jadwal hari ini ----------
  const DAY_NAMES = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
  function mondayOf(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function isoDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }
  function parseDate(s) {
    const m = s && s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  // Nomor triptych (1..30, berulang) untuk pekan ke-w (0-based) dan slot 0/1/2.
  const tripNo = (w, slot) => (((w * 3 + slot) % TOTAL) + TOTAL) % TOTAL + 1;

  function renderToday(all, P) {
    const el = $("#hari-ini");
    const now = new Date();
    const dow = now.getDay();
    const startStr = store.get(START_KEY);
    const start = parseDate(startStr);
    const byNo = n => all.find(x => x.no === n);

    const dateLabel = now.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    let weekIdx = null;
    if (start) weekIdx = Math.round((mondayOf(now) - mondayOf(start)) / (7 * 864e5));

    const settings = `
      <div class="settings">
        <label for="mulai">Pekan 1 dimulai hari Senin tanggal</label>
        <input type="date" id="mulai" value="${startStr || ""}">
        ${start ? `<button class="btn" id="reset">Hapus</button>` : ""}
      </div>`;

    let html = `
      <div class="card">
        <div class="today-head">
          <div>
            <div class="eyebrow">${esc(dateLabel)}</div>
            <h2>${todayHeadline(dow)}</h2>
          </div>
          ${weekIdx !== null && weekIdx >= 0 ? `<span class="pill gold">Pekan ${(weekIdx % 10) + 1} · putaran ${Math.floor(weekIdx / 10) + 1}</span>` : ""}
        </div>
        ${weekStrip(dow)}
      </div>`;

    if (!start) {
      html += `
        <div class="card">
          <h3 class="serif" style="margin-top:0">Atur tanggal mulai dulu</h3>
          <p class="small">Pilih hari Senin saat triptych <b>#01</b> diunggah. Setelah itu halaman ini otomatis menampilkan konten yang harus diposting hari ini. Tanggal disimpan di browser ini saja.</p>
          ${settings}
        </div>`;
      html += `<p class="eyebrow">Contoh — triptych pertama</p>` + tripCard(byNo(1), P);
      el.innerHTML = html;
      bindSettings();
      return;
    }
    if (weekIdx < 0) {
      html += `<div class="card"><p style="margin-top:0">Seri belum dimulai — Pekan 1 mulai <b>${start.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long" })}</b>. Siapkan tiga triptych pertama:</p>${settings}</div>`;
      html += [0, 1, 2].map(s => tripCard(byNo(tripNo(0, s)), P)).join("");
      el.innerHTML = html; bindSettings(); return;
    }

    const slot = { 1: 0, 3: 1, 5: 2 }[dow];
    if (slot !== undefined) {
      const it = byNo(tripNo(weekIdx, slot));
      html += `<div class="card"><p class="eyebrow">Posting triptych · 05.00–06.00 WIB</p>
        <ol class="steps">
          <li>Upload urut <b>3-kanan → 2-tengah → 1-kiri</b>, jeda 1–3 menit.</li>
          <li>Caption: kanan lengkap + ajakan QRIS, tengah dalil, kiri hook.</li>
          <li>Bagikan post kiri ke Story + stiker link wadahqris.id.</li>
        </ol></div>`;
      html += tripCard(it, P, { today: true });
    } else if (dow === 2 || dow === 4) {
      const src = byNo(tripNo(weekIdx, dow === 2 ? 0 : 1));
      html += `<div class="card"><p class="eyebrow">Upload Reels · ${dow === 2 ? "12.00 atau 19.30" : "19.30 (malam Jumat)"} WIB</p>
        <ol class="steps">
          <li>${dow === 2 ? "Reels dari triptych Senin" : "Reels pengingat “besok Jumat” / dari triptych Rabu"} (format Panorama Geser, 12 detik).</li>
          <li>Matikan <b>“Tampilkan di grid profil”</b> supaya grid tidak bergeser.</li>
          <li>Pilih sampul yang ada judulnya.</li>
        </ol></div>`;
      html += tripCard(src, P, { note: "Bahan Reels hari ini:" });
    } else if (dow === 0) {
      html += `<div class="card"><p class="eyebrow">Hari produksi (±1,5 jam) — siapkan pekan depan</p>
        <ol class="steps">
          <li>Generate 3 gambar panorama (tombol “Salin prompt gambar” di bawah).</li>
          <li>Canva: kanvas 3240×1440, tambah teks hook, dalil (Arab manual), ajakan, bar logo.</li>
          <li>Potong jadi 3: <code>python3 tools/split_triptych.py 01.png</code> atau aplikasi grid maker.</li>
          <li>Buat 2 Reels dari panorama yang sama, simpan di draf.</li>
          <li>Siapkan caption (tombol “Salin prompt caption”).</li>
        </ol></div>`;
      html += [0, 1, 2].map(s => tripCard(byNo(tripNo(weekIdx + 1, s)), P)).join("");
    } else {
      html += `<div class="card"><p style="margin:0">Hari Sabtu: cukup Story harian (doa pagi, pengingat sedekah subuh, stiker link QRIS). Besok hari produksi.</p></div>`;
    }
    html += `<div class="card">${settings}</div>`;
    el.innerHTML = html;
    bindSettings();
  }
  function todayHeadline(dow) {
    return {
      0: "Hari produksi konten",
      1: "Triptych Senin",
      2: "Reels Selasa",
      3: "Triptych Rabu",
      4: "Reels malam Jumat",
      5: "Triptych Jumat ✅ wajib",
      6: "Story saja",
    }[dow];
  }
  function weekStrip(dow) {
    const order = [1, 2, 3, 4, 5, 6, 0];
    const what = { 1: "Triptych", 2: "Reels", 3: "Triptych", 4: "Reels", 5: "Triptych", 6: "Story", 0: "Produksi" };
    return `<div class="week-grid">${order.map(d => `
      <div class="${d === dow ? "now" : ""} ${[1, 3, 5].includes(d) ? "trip" : ""}"><b>${DAY_NAMES[d].slice(0, 3)}</b>${what[d]}</div>`).join("")}</div>`;
  }
  function bindSettings() {
    const input = $("#mulai");
    if (input) input.addEventListener("change", () => {
      const d = parseDate(input.value);
      if (d && d.getDay() !== 1) {
        const mon = mondayOf(d);
        notify("Disesuaikan ke hari Senin");
        store.set(START_KEY, isoDate(mon));
      } else store.set(START_KEY, input.value);
      renderToday(ALL, PROMPTS);
    });
    const r = $("#reset");
    if (r) r.addEventListener("click", () => { store.set(START_KEY, ""); renderToday(ALL, PROMPTS); });
  }

  // ---------- Kalender ----------
  function renderCalendar(weeks, P) {
    const el = $("#kalender");
    const days = ["Semua", ...TRIP_DAYS];
    el.innerHTML = `
      <div class="filter" id="dayfilter">${days.map((d, i) => `<button aria-pressed="${i === 0}" data-day="${d}">${d}</button>`).join("")}</div>
      <div id="weeks">${weeks.map(w => `
        <div class="week-block">
          <h2>Pekan ${w.no} — ${esc(w.title)}</h2>
          <p class="muted small">${esc(w.mood)}</p>
          ${w.items.map(it => `<div data-day="${esc(it.day)}">${tripCard(it, P)}</div>`).join("")}
        </div>`).join("")}</div>`;
    el.querySelectorAll("#dayfilter button").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll("#dayfilter button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      el.querySelectorAll("#weeks [data-day]").forEach(c => c.hidden = b.dataset.day !== "Semua" && c.dataset.day !== b.dataset.day);
    }));
  }

  // ---------- Panduan lengkap ----------
  function slug(s) {
    return s.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
  }
  function renderDoc(md) {
    const doc = $("#doc");
    doc.innerHTML = marked.parse(md);
    const used = new Set();
    doc.querySelectorAll("h1,h2,h3").forEach(h => {
      let id = slug(h.textContent) || "bagian", n = 2;
      while (used.has(id)) id = slug(h.textContent) + "-" + n++;
      used.add(id); h.id = id;
    });
    doc.querySelectorAll("table").forEach(t => {
      const w = document.createElement("div"); w.className = "table-scroll";
      t.replaceWith(w); w.append(t);
    });
    doc.querySelectorAll("pre").forEach(pre => {
      const b = document.createElement("button");
      b.className = "copy-mini"; b.textContent = "Salin";
      b.dataset.copy = pre.textContent; b.dataset.what = "Teks";
      pre.append(b);
    });
    const h2s = [...doc.querySelectorAll("h2")];
    const links = h2s.map(h => `<a href="#${h.id}" data-doc-link>${esc(h.textContent)}</a>`).join("");
    $("#toc").innerHTML = window.innerWidth <= 820
      ? `<details class="card" style="padding:10px"><summary>Daftar isi</summary>${links}</details>`
      : `<div class="eyebrow" style="padding:0 8px 6px">Daftar isi</div>${links}`;
  }
  // Tautan daftar isi tidak boleh mengganti hash tab.
  document.addEventListener("click", e => {
    const a = e.target.closest("a[data-doc-link]");
    if (!a) return;
    e.preventDefault();
    document.getElementById(a.getAttribute("href").slice(1))?.scrollIntoView({ behavior: "smooth" });
  });

  // ---------- Muat ----------
  let ALL = [], PROMPTS = {};
  fetch(SRC, { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.text(); })
    .then(md => {
      const weeks = parseCalendar(md);
      ALL = weeks.flatMap(w => w.items);
      PROMPTS = {
        master: extractCode(md, "### 6a."),
        caption: extractCode(md, "### 6d."),
        reels: extractCode(md, "### 8e."),
        moods: parseMoods(md),
      };
      if (!ALL.length) throw new Error("Kalender tidak ditemukan di " + SRC);
      renderToday(ALL, PROMPTS);
      renderCalendar(weeks, PROMPTS);
      renderDoc(md);
      const h = location.hash.slice(1);
      if (h) showTab(h, false);
    })
    .catch(err => {
      $("#hari-ini").innerHTML = `<div class="card"><p class="err">Gagal memuat ${SRC}: ${esc(String(err.message || err))}</p>
        <p class="small muted">Kalau membuka file ini langsung dari komputer, jalankan dulu <code>python3 -m http.server</code> dari folder <code>_site</code> (lihat README).</p></div>`;
    });
})();
</script>
</body>
</html>
